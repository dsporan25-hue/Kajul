name: Android CI - Build Kajol Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Android Project & Prepare Wrapper
        run: |
          # Detect whether the Android project is in repository root or in 'android' directory
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            TARGET_DIR="."
          elif [ -d "android" ] && ( [ -f "android/settings.gradle.kts" ] || [ -f "android/settings.gradle" ] ); then
            echo "PROJECT_DIR=android" >> $GITHUB_ENV
            TARGET_DIR="android"
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            TARGET_DIR="."
          fi

          echo "Detected Android project in: $TARGET_DIR"
          cd "$TARGET_DIR"

          # If gradlew does not exist, generate it via the pre-installed Gradle CLI
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi

          chmod +x gradlew
          ls -la gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kajol-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
